# Skynet Whisper Transcription Service — Gensenta, REMOTE API mode (no GPU)
# Speech-to-text is delegated to Gensenta's OpenAI-compatible endpoint
# (POST {WHISPER_API_URL}/audio/transcriptions); Silero VAD runs locally on CPU.
# The Jitsi -> skynet websocket (:8000/streaming-whisper/ws) and the
# PharmaVeritas TranscriptStatus integration are unchanged.
#
# Secrets/environment values come from a .env file next to this compose file
# (see .env.gensenta-api.example) — never commit real values.
# Usage: docker compose -f compose-gensenta-api.yml --env-file .env up --build -d

services:
  skynet-web:
    build:
      context: .
      # code-only layer on top of the existing Dockerfile.gensenta image
      dockerfile: Dockerfile.gensenta-api
      args:
        BASE_IMAGE: ${SKYNET_BASE_IMAGE:-skynet-skynet-web:latest}
    # separate tag so the base image (rollback / GPU mode) is never overwritten
    image: skynet-skynet-web:api
    platform: linux/amd64
    container_name: skynet-web-test
    user: "0:0"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - skynet-transcripts:/opt/transcripts
    environment:
      - REDIS_HOST=skynet-redis
      - HTTP_PORT=8000
      - METRICS_PORT=8001
      - BYPASS_AUTHORIZATION=1
      - ENABLED_MODULES=streaming_whisper
      # Remote Whisper API
      - WHISPER_BACKEND=api
      - WHISPER_API_URL=${WHISPER_API_URL:?WHISPER_API_URL is required}
      - WHISPER_API_KEY=${WHISPER_API_KEY:?WHISPER_API_KEY is required}
      - WHISPER_API_MODEL=${WHISPER_API_MODEL:-whisper}
      - WHISPER_API_LANGUAGE=${WHISPER_API_LANGUAGE:-tr}
      - WHISPER_API_TIMEOUT=${WHISPER_API_TIMEOUT:-30}
      - WHISPER_API_WORD_TIMESTAMPS=${WHISPER_API_WORD_TIMESTAMPS:-true}
      # measured 2026-11-11 on Gensenta's gateway (~0.2 s/request): 750 ms gives
      # ~0.5 s first interim; prompt off avoids whisper.cpp continuing patterns
      # from previous finals (e.g. inventing '3. Bulgu')
      - WHISPER_API_MIN_INTERVAL_MS=${WHISPER_API_MIN_INTERVAL_MS:-750}
      - WHISPER_API_SEND_PROMPT=${WHISPER_API_SEND_PROMPT:-false}
      - WHISPER_API_MAX_BUFFER_S=${WHISPER_API_MAX_BUFFER_S:-20}
      - WHISPER_API_MAX_CONNECTIONS=${WHISPER_API_MAX_CONNECTIONS:-16}
      - WHISPER_MIN_PROBABILITY=0.5
      # VAD Settings (same as GPU deployment)
      - STREAMING_WHISPER_VAD_BACKEND=webrtc
      - STREAMING_WHISPER_VAD_MODE=2
      - STREAMING_WHISPER_WINDOW_SIZE_SAMPLES=320
      - STREAMING_WHISPER_MIN_SILENCE_DURATION_MS=600
      - STREAMING_WHISPER_SPEECH_PAD_MS=300
      - VAD_THRESHOLD=0.4
      - VAD_MIN_SPEECH_DURATION=0.1
      - VAD_MIN_SILENCE_DURATION=0.8
      # Transcript Save Settings
      - STREAMING_WHISPER_SAVE_TRANSCRIPTS=true
      - STREAMING_WHISPER_OUTPUT_DIR=/opt/transcripts
      - STREAMING_WHISPER_OUTPUT_FORMATS=jsonl,srt
      - STREAMING_WHISPER_FLUSH_INTERVAL_MS=7000
      # Transcript Status API (PharmaVeritas backend via nginx)
      - TRANSCRIPT_STATUS_API_URL=${TRANSCRIPT_STATUS_API_URL:?required}
      - TRANSCRIPT_STATUS_API_KEY=${TRANSCRIPT_STATUS_API_KEY:?required}
      - TRANSCRIPT_STATUS_API_ENABLED=true
      # SeaweedFS/S3 Configuration
      - SKYNET_S3_ENDPOINT=${SKYNET_S3_ENDPOINT:?required}
      - SKYNET_S3_BUCKET=${SKYNET_S3_BUCKET:-eye-transcripts}
      - SKYNET_S3_ACCESS_KEY=${SKYNET_S3_ACCESS_KEY:?required}
      - SKYNET_S3_SECRET_KEY=${SKYNET_S3_SECRET_KEY:?required}
      - SKYNET_S3_REGION=us-east-1
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      - skynet-redis
    restart: unless-stopped
    networks:
      - skynet-net

  skynet-redis:
    image: redis:alpine
    platform: linux/amd64
    container_name: skynet-redis-test
    restart: unless-stopped
    networks:
      - skynet-net

networks:
  skynet-net:
    driver: bridge

volumes:
  skynet-transcripts:
